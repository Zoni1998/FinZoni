name: Validate AMOLED polish

on:
  push:
    branches:
      - fix/amoled-overlay-polish
    paths:
      - .github/workflows/validate-amoled-polish.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amoled-overlay-polish
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check AMOLED and overlay rules
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          js = Path("app.js").read_text(encoding="utf-8")
          assert "notifications-open" in js
          assert "zoni-chat-open .mobile-menu-btn" in css
          assert "theme-amoled body" in css
          assert "background-image: none !important" in css
          assert "tooltipBg" in js and "#000000" in js
          assert "style.css?v=352" in html
          assert "app.js?v=352" in html
          assert css.count("{") == css.count("}")
