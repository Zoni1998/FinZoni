name: Validate chart polish

on:
  push:
    branches:
      - fix/polish-dashboard-charts
    paths:
      - .github/workflows/validate-chart-polish.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polish-dashboard-charts
      - name: Check JavaScript syntax
        run: node --check app.js
