name: Fix mobile responsive layout

on:
  push:
    branches:
      - fix/mobile-responsive-layout
    paths:
      - .github/workflows/fix-mobile-responsive-layout.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-responsive-layout

      - name: Patch mobile layout
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')

          marker = '/* ── MOBILE LAYOUT STABILITY PATCH ── */'
          patch = r'''
/* ── MOBILE LAYOUT STABILITY PATCH ── */
@media (max-width: 768px) {
  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .app-container {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .main-content {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin-left: 0 !important;
  }

  .page-content,
  .tab-content,
  .tab-content.active {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }

  .page-content {
    padding: 16px 12px 96px !important;
  }

  .section-header,
  .summary-grid,
  .charts-grid,
  .forecast-grid,
  .card,
  .summary-card,
  .forecast-card,
  .reserve-summary,
  .wallet-page-header,
  .wallet-summary,
  .wallet-launches {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }

  .summary-grid {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }

  .main-header {
    width: calc(100% - 12px);
    max-width: calc(100% - 12px);
    min-height: 64px;
    height: auto;
    margin: 6px 6px 12px;
    padding: 10px 10px 10px 58px;
    gap: 8px;
    flex-wrap: nowrap;
    border-radius: 14px;
  }

  .month-selector {
    gap: 6px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .month-selector .current-month {
    min-width: 0;
    width: auto;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .month-selector .month-nav-btn {
    width: 34px;
    min-width: 34px;
    height: 34px;
  }

  .header-actions {
    flex: 0 0 auto;
    min-width: 0;
    gap: 6px;
  }

  .search-bar {
    display: none !important;
  }

  .header-actions .btn,
  .header-actions .btn-icon {
    min-width: 34px;
  }

  .sidebar {
    top: 0 !important;
    left: 0 !important;
    bottom: auto !important;
    width: min(86vw, 320px) !important;
    height: 100dvh !important;
    max-height: 100dvh !important;
    border-radius: 0 16px 16px 0 !important;
    overflow: hidden !important;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .sidebar-header,
  .sidebar-profile {
    flex: 0 0 auto;
  }

  .sidebar-nav {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-bottom: 28px !important;
  }

  .sidebar-footer {
    flex: 0 0 auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }

  .mobile-overlay.show {
    display: block;
    z-index: 1900;
  }

  .fab-ia {
    position: fixed !important;
    right: max(12px, env(safe-area-inset-right)) !important;
    bottom: calc(18px + env(safe-area-inset-bottom)) !important;
    width: 52px !important;
    min-width: 52px !important;
    height: 52px !important;
    z-index: 3000 !important;
    transform: none;
    margin: 0 !important;
  }

  .fab-ia:hover {
    transform: none;
  }

  .data-table {
    max-width: 100%;
  }

  img,
  canvas,
  svg {
    max-width: 100%;
  }
}

@media (max-width: 420px) {
  .main-header {
    padding-left: 56px;
  }

  .month-selector .current-month {
    font-size: 0.82rem;
  }

  .header-actions {
    gap: 4px;
  }
}
'''

          if marker not in css:
              css = css.rstrip() + '\n\n' + patch.strip() + '\n'
              css_path.write_text(css, encoding='utf-8')

          js_path = Path('app.js')
          raw = js_path.read_bytes()
          old = b"document.getElementById('mobileOverlay').addEventListener('click', () => this.closeMobileMenu());"
          new = b"document.getElementById('mobileOverlay').addEventListener('click', (event) => { event.preventDefault(); });"
          if old in raw:
              raw = raw.replace(old, new, 1)
          elif new not in raw:
              raise SystemExit('mobile overlay handler target not found')
          js_path.write_bytes(raw)

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css app.js
          git commit -m "fix: improve mobile responsiveness and sticky AI button"
          git push origin HEAD:fix/mobile-responsive-layout
