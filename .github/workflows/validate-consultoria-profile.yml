name: Validate consultancy profile sidebar

on:
  push:
    branches:
      - fix/consultoria-profile-sidebar
    paths:
      - .github/workflows/validate-consultoria-profile.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consultoria-profile-sidebar

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check zoni-context.js

      - name: Run Zoni tests
        run: node --test tests/zoni.test.cjs

      - name: Check markup and style invariants
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          js = Path("app.js").read_text(encoding="utf-8")
          ctx = Path("zoni-context.js").read_text(encoding="utf-8")
          for rid in [
              "modalProfile","profileNameInput","profileRiskInput","profileGoalInput",
              "profileMonthlyContributionInput","profileHorizonInput","profileModalReserve",
              "profileModalBalance","profileModalXpFill"
          ]:
              assert html.count(f'id="{rid}"') == 1, rid
          assert "buildConsultoriaFallback" in js
          assert "meta/llama-3.1-8b-instruct" in js
          assert "sidebar-open" in js and "sidebar-open" in css
          assert "Perfil financeiro declarado" in ctx
          assert "style.css?v=353" in html
          assert "zoni-context.js?v=353" in html
          assert "app.js?v=353" in html
          assert css.count("{") == css.count("}")
