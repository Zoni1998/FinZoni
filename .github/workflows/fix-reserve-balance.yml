name: Fix emergency reserve balance

on:
  push:
    branches:
      - fix/emergency-reserve-balance
    paths:
      - .github/workflows/fix-reserve-balance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/emergency-reserve-balance

      - name: Patch reserve balance support
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if new in text:
                  print(f'{label}: already patched')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: target not found')
              text = text.replace(old, new, 1)
              print(f'{label}: patched')

          replace_once(
              """    reserva: {\n      movimentacoes: [],\n      obs: ''\n    },""",
              """    reserva: {\n      saldoInicial: 0,\n      movimentacoes: [],\n      obs: ''\n    },""",
              'default reserve model'
          )

          replace_once(
              """            if (!parsed.reserva) parsed.reserva = { movimentacoes: [], obs: '' };\n            if (!parsed.categoriasFixas)""",
              """            if (!parsed.reserva) parsed.reserva = { saldoInicial: 0, movimentacoes: [], obs: '' };\n            if (parsed.reserva.saldoInicial === undefined) parsed.reserva.saldoInicial = 0;\n            if (!parsed.categoriasFixas)""",
              'local migration'
          )

          replace_once(
              """    if (!this.data.reserva) this.data.reserva = { movimentacoes: [], obs: '' };\n    if (!this.data.categoriasFixas)""",
              """    if (!this.data.reserva) this.data.reserva = { saldoInicial: 0, movimentacoes: [], obs: '' };\n    if (this.data.reserva.saldoInicial === undefined) this.data.reserva.saldoInicial = 0;\n    if (!this.data.categoriasFixas)""",
              'cloud migration'
          )

          replace_once(
              """  calcReserva() {\n    let saldo = 0;\n    let totalSaques = 0;\n    let totalDepositos = 0;""",
              """  calcReserva() {\n    let saldo = Number(this.dm.data.reserva?.saldoInicial || 0);\n    let totalSaques = 0;\n    let totalDepositos = 0;""",
              'reserve calculation'
          )

          replace_once(
              """    document.getElementById('btnSalvarReserva').addEventListener('click', () => this.saveReservaMov());\n\n    // Goal""",
              """    document.getElementById('btnSalvarReserva').addEventListener('click', () => this.saveReservaMov());\n\n    const reservaSaldoEl = document.getElementById('reservaSaldo');\n    if (reservaSaldoEl) {\n      reservaSaldoEl.style.cursor = 'pointer';\n      reservaSaldoEl.title = 'Clique para ajustar o saldo real da reserva';\n      reservaSaldoEl.setAttribute('role', 'button');\n      reservaSaldoEl.setAttribute('tabindex', '0');\n      const abrirAjuste = () => this.ajustarSaldoReserva();\n      reservaSaldoEl.addEventListener('click', abrirAjuste);\n      reservaSaldoEl.addEventListener('keydown', (event) => {\n        if (event.key === 'Enter' || event.key === ' ') {\n          event.preventDefault();\n          abrirAjuste();\n        }\n      });\n    }\n\n    // Goal""",
              'reserve edit interaction'
          )

          replace_once(
              """  saveReservaMov() {\n    const tipo = document.getElementById('reservaTipo').value;""",
              """  async ajustarSaldoReserva() {\n    const saldoAtual = Number(this.calcReserva().saldo || 0);\n    const valorDigitado = window.prompt(\n      'Informe o saldo real atual da Reserva de Emergência.\\nEsse ajuste não será registrado como depósito ou saque.',\n      saldoAtual.toFixed(2).replace('.', ',')\n    );\n\n    if (valorDigitado === null) return;\n\n    const bruto = String(valorDigitado)\n      .trim()\n      .replace(/^R\\$\\s*/i, '')\n      .replace(/\\s/g, '');\n    const normalizado = bruto.includes(',')\n      ? bruto.replace(/\\./g, '').replace(',', '.')\n      : bruto;\n    const saldoDesejado = Number(normalizado);\n\n    if (!Number.isFinite(saldoDesejado) || saldoDesejado < 0) {\n      showToast('Informe um saldo válido maior ou igual a zero.', 'error');\n      return;\n    }\n\n    const movimentacoes = this.dm.data.reserva.movimentacoes || [];\n    const saldoLiquidoMovimentacoes = movimentacoes.reduce((total, mov) => {\n      const valor = Number(mov.valor || 0);\n      return total + (mov.tipo === 'deposito' ? valor : -valor);\n    }, 0);\n\n    const saldoInicialAnterior = Number(this.dm.data.reserva.saldoInicial || 0);\n    this.dm.data.reserva.saldoInicial = saldoDesejado - saldoLiquidoMovimentacoes;\n\n    const salvo = await this.dm.saveNow();\n    if (!salvo) {\n      this.dm.data.reserva.saldoInicial = saldoInicialAnterior;\n      this.renderAll();\n      showToast('Não foi possível salvar o ajuste da reserva.', 'error');\n      return;\n    }\n\n    this.renderAll();\n    showToast('Saldo da reserva ajustado sem criar depósito.', 'success');\n  }\n\n  saveReservaMov() {\n    const tipo = document.getElementById('reservaTipo').value;""",
              'reserve balance adjustment method'
          )

          path.write_text(text, encoding='utf-8')

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "fix: allow direct emergency reserve balance adjustment"
          git push origin HEAD:fix/emergency-reserve-balance
