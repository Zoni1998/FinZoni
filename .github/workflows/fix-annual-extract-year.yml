name: Fix annual extract current year

on:
  push:
    branches:
      - fix/annual-extract-current-year
    paths:
      - .github/workflows/fix-annual-extract-year.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annual-extract-current-year

      - name: Patch annual extract year handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          raw = path.read_bytes()

          def replace_once(old, new, label):
              global raw
              for nl in ('\n', '\r\n'):
                  old_b = old.replace('\n', nl).encode('utf-8')
                  new_b = new.replace('\n', nl).encode('utf-8')
                  if new_b in raw:
                      print(f'{label}: already patched')
                      return
                  if old_b in raw:
                      raw = raw.replace(old_b, new_b, 1)
                      print(f'{label}: patched')
                      return
              raise SystemExit(f'{label}: target not found')

          replace_once(
              """    if (!this.data.meses) this.data.meses = {};\n    if (this.data.appsScriptUrl === undefined) this.data.appsScriptUrl = '';""",
              """    if (!this.data.meses) this.data.meses = {};\n\n    const storedYear = Number(this.data.year || YEAR);\n    if (Number.isFinite(storedYear) && storedYear !== YEAR) {\n      const oldPrefix = `${storedYear}-`;\n      const newPrefix = `${YEAR}-`;\n      const migrateDateYears = (value) => {\n        if (!value || typeof value !== 'object') return;\n        if (Array.isArray(value)) {\n          value.forEach(migrateDateYears);\n          return;\n        }\n        Object.keys(value).forEach(key => {\n          const item = value[key];\n          if (typeof item === 'string' && item.startsWith(oldPrefix)) {\n            value[key] = newPrefix + item.slice(oldPrefix.length);\n          } else if (item && typeof item === 'object') {\n            migrateDateYears(item);\n          }\n        });\n      };\n      migrateDateYears(this.data);\n      this.data.year = YEAR;\n    } else if (!this.data.year) {\n      this.data.year = YEAR;\n    }\n\n    if (this.data.appsScriptUrl === undefined) this.data.appsScriptUrl = '';""",
              'current year migration'
          )

          replace_once(
              """    const currentYear = new Date().getFullYear();\n    select.innerHTML = '';\n    for (let y = currentYear - 2; y <= currentYear + 2; y++) {\n      const opt = document.createElement('option');\n      opt.value = y;\n      opt.textContent = y;\n      if (y === currentYear) opt.selected = true;\n      select.appendChild(opt);\n    }""",
              """    const currentYear = YEAR;\n    const selectedYear = Number(this.dm?.data?.year || currentYear);\n    select.innerHTML = '';\n    for (let y = currentYear - 2; y <= currentYear + 2; y++) {\n      const opt = document.createElement('option');\n      opt.value = y;\n      opt.textContent = y;\n      if (y === selectedYear) opt.selected = true;\n      select.appendChild(opt);\n    }""",
              'year selector default'
          )

          replace_once(
              """    const year = yearSelect.value;\n    const tbody = document.getElementById('extratoAnualBody');""",
              """    const selectedYear = Number(yearSelect.value || this.dm.data.year || YEAR);\n    const dataYear = Number(this.dm.data.year || YEAR);\n    const tbody = document.getElementById('extratoAnualBody');""",
              'annual selected year'
          )

          replace_once(
              """       const rec = this.calcTotalReceitas(m);\n       const desp = this.calcResumoDespesas(m).total;\n       \n       const mesStr = `${year}-${String(m).padStart(2,'0')}`;""",
              """       const isDataYear = selectedYear === dataYear;\n       const rec = isDataYear ? this.calcTotalReceitas(m) : 0;\n       const desp = isDataYear ? this.calcResumoDespesas(m).total : 0;\n       \n       const mesStr = `${selectedYear}-${String(m).padStart(2,'0')}`;""",
              'annual calculation year guard'
          )

          path.write_bytes(raw)

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: keep annual extract on current year"
          git push origin HEAD:fix/annual-extract-current-year
