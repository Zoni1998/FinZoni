name: Validate chart restore

on:
  push:
    branches:
      - fix/restore-charts-mobile
    paths:
      - .github/workflows/validate-chart-restore.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-charts-mobile
      - name: Check JavaScript syntax
        run: node --check app.js
