name: Validate noise background

on:
  push:
    branches:
      - feat/noise-background
    paths:
      - .github/workflows/validate-noise-background.yml
      - index.html
      - style.css

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/noise-background
      - name: Validate CSS and cache bust
        shell: python
        run: |
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          css=Path("style.css").read_text(encoding="utf-8")
          assert "style.css?v=358" in html
          assert "ACETERNITY-INSPIRED NOISE BACKGROUND" in css
          assert "--noise-gradient-a" in css
          assert "finzoni-noise-gradient-drift" in css
          assert "finzoni-noise-grain" in css
          assert "theme-amoled" in css
          assert css.count("{")==css.count("}")
